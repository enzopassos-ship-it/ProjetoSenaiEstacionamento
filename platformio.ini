; ==========================================================================
;  Estacionamento Inteligente - Projeto SENAI
;  ESP32 + sensor magnetico MC-38 (via optoacoplador PC817) + LEDs + painel web
; --------------------------------------------------------------------------
;  Como gravar (barra azul do PlatformIO no VS Code):
;    1) Upload                     -> grava o firmware (src/main.cpp)
;    2) Upload Filesystem Image    -> grava o painel web (pasta data/)
;    3) Monitor                    -> mostra o IP do painel
;
;  O projeto usa somente bibliotecas que ja vem com o ESP32
;  (WiFi, WebServer, ESPmDNS, LittleFS): nada para instalar.
; ==========================================================================

[env:esp32dev]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder, time

; O painel (pasta data/) fica gravado no sistema de arquivos LittleFS
board_build.filesystem = littlefs

build_flags =
    -D CORE_DEBUG_LEVEL=0